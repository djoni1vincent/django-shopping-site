{% extends "base_generic.html" %} {% block content %}
<h1>Title: {{ product_detail.name }}</h1>

<p><strong>Brand:</strong> <a href="">{{ product_detail.brand }}</a></p>
<div style="display: flexbox">
    <img
        style="max-height: 300px; max-width: 300px"
        src="{{ product_detail.image_url }}"
        alt="{{ product_detail.name }}"
    />
    <p><strong>Price:</strong> {{ product_detail.price }}</p>
    <p><strong>Summary:</strong> {{ product_detail.description }}</p>
    <p><strong>Category:</strong> {{ product_detail.category }}</p>
    <p><strong>Stock:</strong> {{ product_detail.stock }}</p>

</div>
{% endblock %}
